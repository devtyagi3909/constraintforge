[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constraintforge"
version = "0.1.0"
description = "Pre-Synthesis Structural Diagnostic Engine"
authors = [
    {name = "Dev Tyagi", email = "devtyagi3909@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=10.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "tox>=4.0"
]

[project.scripts]
constraintforge = "constraintforge.main:main"
