[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "constraintforge"
version = "0.1.0"
description = "Pre-synthesis structural timing analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
constraintforge = "constraintforge.main:cli"
