<?xml version='1.0' encoding='utf-8'?>
<svg width="900" height="430" xmlns="http://www.w3.org/2000/svg" style="background-color: #0d1117; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;"><style>
        @keyframes reveal { from { width: 0px; } to { width: 450px; } }
        #clip-rect { animation: reveal 2.5s steps(40, end) forwards; animation-delay: 0.5s; }
        #cursor { animation: move-cursor 2.5s steps(40, end) forwards, blink-caret 0.75s step-end infinite; animation-delay: 0.5s; }
        @keyframes move-cursor { from { transform: translateX(0px); } to { transform: translateX(450px); } }
        @keyframes blink-caret { from, to { opacity: 0; } 50% { opacity: 1; } }
        .output { opacity: 0; animation: show-output 0.1s forwards; animation-delay: 3.2s; }
        @keyframes show-output { to { opacity: 1; } }
        .hide-cursor { animation: hide-it 0.1s forwards; animation-delay: 3.2s; }
        @keyframes hide-it { to { opacity: 0; } }
    </style><rect x="20" y="20" width="860" height="390" fill="#0d1117" stroke="#30363d" stroke_width="1" rx="6" /><rect x="20" y="20" width="860" height="30" fill="#161b22" stroke="#30363d" stroke_width="1" rx="6" /><rect x="21" y="40" width="858" height="10" fill="#161b22" /><circle cx="40" cy="35" r="6" fill="#ff5f56" /><circle cx="60" cy="35" r="6" fill="#ffbd2e" /><circle cx="80" cy="35" r="6" fill="#27c93f" /><text x="450" y="40" fill="#8b949e" font_size="12" font_weight="bold" text_anchor="middle">devtyagi@macbook: ~/constraintforge</text><g transform="translate(40, 80)"><g><text x="0" y="0" fill="#3fb950" font_size="14" font_weight="bold">➜</text><text x="20" y="0" fill="#79c0ff" font_size="14" font_weight="bold">~</text></g></g><defs><clipPath id="type-clip"><rect x="75" y="65" width="0" height="20" id="clip-rect" /></clipPath></defs><text x="75" y="80" fill="#c9d1d9" font_size="14" font_weight="500" clip-path="url(#type-clip)"><tspan fill="#ff7b72">constraintforge</tspan><tspan fill="#c9d1d9"> generate --top core.v --board arty-a7</tspan></text><rect x="75" y="66" width="8" height="16" fill="#58a6ff" id="cursor" class="hide-cursor" /><g transform="translate(40, 120)" class="output"><text x="0" y="0" font_size="13" font_weight="500"><tspan fill="#8b949e">Analyzed core.v: Found 1 Clock, 2 Async Resets, 1 SPI Interface</tspan></text><text x="0" y="22" font_size="13" font_weight="500"><tspan fill="#8b949e">Mapping pins for Digilent Arty A7-100T...</tspan></text><text x="0" y="66" font_size="13" font_weight="500"><tspan fill="#8b949e">## GENERATED CONSTRAINTS (core_arty.xdc) ##</tspan></text><text x="0" y="110" font_size="13" font_weight="500"><tspan fill="#ff7b72">create_clock</tspan><tspan fill="#c9d1d9"> -name sys_clk -period </tspan><tspan fill="#79c0ff">10.000</tspan><tspan fill="#c9d1d9"> [</tspan><tspan fill="#ff7b72">get_ports</tspan><tspan fill="#c9d1d9"> clk_100mhz]</tspan></text><text x="0" y="132" font_size="13" font_weight="500"><tspan fill="#ff7b72">set_property</tspan><tspan fill="#c9d1d9"> -dict { PACKAGE_PIN E3  IOSTANDARD LVCMOS33 } [</tspan><tspan fill="#ff7b72">get_ports</tspan><tspan fill="#c9d1d9"> clk_100mhz]</tspan></text><text x="0" y="176" font_size="13" font_weight="500"><tspan fill="#8b949e"># SPI Master Constraints (Generated SCLK)</tspan></text><text x="0" y="198" font_size="13" font_weight="500"><tspan fill="#ff7b72">create_generated_clock</tspan><tspan fill="#c9d1d9"> -name spi_clk -source [</tspan><tspan fill="#ff7b72">get_ports</tspan><tspan fill="#c9d1d9"> clk_100mhz] -divide_by </tspan><tspan fill="#79c0ff">4</tspan><tspan fill="#c9d1d9"> [</tspan><tspan fill="#ff7b72">get_pins</tspan><tspan fill="#c9d1d9"> spi_ctrl/sclk_reg/Q]</tspan></text><text x="0" y="220" font_size="13" font_weight="500"><tspan fill="#ff7b72">set_output_delay</tspan><tspan fill="#c9d1d9"> -clock spi_clk -max </tspan><tspan fill="#79c0ff">2.0</tspan><tspan fill="#c9d1d9"> [</tspan><tspan fill="#ff7b72">get_ports</tspan><tspan fill="#c9d1d9"> spi_mosi]</tspan></text><text x="0" y="264" font_size="13" font_weight="500"><tspan fill="#8b949e"># Asynchronous Resets (False Paths)</tspan></text><text x="0" y="286" font_size="13" font_weight="500"><tspan fill="#ff7b72">set_false_path</tspan><tspan fill="#c9d1d9"> -from [</tspan><tspan fill="#ff7b72">get_ports</tspan><tspan fill="#c9d1d9"> rst_n]</tspan></text><text x="0" y="330" font_size="13" font_weight="500"><tspan fill="#3fb950">✔ </tspan><tspan fill="#c9d1d9">Successfully wrote core_arty.xdc</tspan></text></g></svg>