<?xml version='1.0' encoding='utf-8'?>
<svg width="1000" height="500" xmlns="http://www.w3.org/2000/svg" style="background-color: #09090b; font-family: 'Space Mono', 'Courier New', monospace;"><defs><filter id="glow-green"><feGaussianBlur stdDeviation="3" result="coloredBlur" /><feMerge><feMergeNode in_="coloredBlur" /><feMergeNode in_="SourceGraphic" /></feMerge></filter><filter id="glow-blue"><feGaussianBlur stdDeviation="3" result="coloredBlur" /><feMerge><feMergeNode in_="coloredBlur" /><feMergeNode in_="SourceGraphic" /></feMerge></filter><filter id="glow-red"><feGaussianBlur stdDeviation="3" result="coloredBlur" /><feMerge><feMergeNode in_="coloredBlur" /><feMergeNode in_="SourceGraphic" /></feMerge></filter><filter id="glow-orange"><feGaussianBlur stdDeviation="3" result="coloredBlur" /><feMerge><feMergeNode in_="coloredBlur" /><feMergeNode in_="SourceGraphic" /></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a24" stroke_width="1" /></pattern></defs><rect width="100%" height="100%" fill="url(#grid)" /><style>
        .trace { stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .trace-clk { stroke: #00ff00; filter: url(#glow-green); }
        .trace-data { stroke: #00bfff; filter: url(#glow-blue); }
        .trace-err { stroke: #ff3333; filter: url(#glow-red); stroke-dasharray: 5 5; animation: blink 1s infinite; }
        .window { fill: rgba(255, 51, 51, 0.2); stroke: #ff3333; stroke-width: 1; stroke-dasharray: 4 4; }
        .window-pass { fill: rgba(0, 255, 0, 0.15); stroke: #00ff00; stroke-width: 1; stroke-dasharray: 4 4; }
        .text { fill: #a1a1aa; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
        .text-hl { fill: #fff; font-size: 16px; font-weight: bold; }
        
        @keyframes draw { from { stroke-dashoffset: 2000; } to { stroke-dashoffset: 0; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .animated-trace {
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: draw 4s ease-out forwards;
        }
        
        .pulse { animation: pulse 2s infinite alternate; }
        @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
    </style><text x="30" y="40" fill="#fff" font_size="22" font_weight="bold">CONSTRAINTFORGE // TIMING ANALYSIS VISUALIZER</text><text x="30" y="65" fill="#00ff00" font_size="14" font_weight="bold">tSU / tH SLACK CALCULATION</text><text x="30" y="140" class="text">clk_sys (100 MHz)</text><text x="30" y="260" class="text">data_in (SDR)</text><text x="30" y="380" class="text">data_out (Fails Timing)</text><path d="M 200 160 L 200 160 L 200 100 L 280 100 L 280 160 L 360 160 L 360 100 L 440 100 L 440 160 L 520 160 L 520 100 L 600 100 L 600 160 L 680 160 L 680 100 L 760 100 L 760 160 L 840 160 L 840 100 L 920 100 L 920 160 L 1000 160" class="trace trace-clk animated-trace" /><path d="M 360 80 L 360 420" stroke="#333" stroke_width="1" stroke_dasharray="4 4" /><path d="M 520 80 L 520 420" stroke="#333" stroke_width="1" stroke_dasharray="4 4" /><path d="M 680 80 L 680 420" stroke="#333" stroke_width="1" stroke_dasharray="4 4" /><path d="M 840 80 L 840 420" stroke="#333" stroke_width="1" stroke_dasharray="4 4" /><path d="M 200 280 L 260 280 L 280 220 L 440 220 L 460 280 L 580 280 L 600 220 L 760 220 L 780 280 L 1000 280" class="trace trace-data animated-trace" style="animation-delay: 0.5s" /><rect x="320" y="210" width="80" height="80" class="window-pass pulse" /><text x="360" y="200" text_anchor="middle" fill="#00ff00" font_size="12" font_weight="bold">Slack: +1.2ns (PASS)</text><path d="M 200 400 L 340 400 L 360 340 L 500 340 L 520 400 L 670 400 L 690 340 L 820 340 L 840 400 L 1000 400" class="trace trace-err animated-trace" style="animation-delay: 1s" /><rect x="480" y="330" width="80" height="80" class="window" /><text x="520" y="320" text_anchor="middle" fill="#ff3333" font_size="12" font_weight="bold">Slack: -0.4ns (VIOLATION)</text><rect x="650" y="20" width="320" height="80" fill="#111" stroke="#444" stroke_width="1" rx="4" /><text x="665" y="45" fill="#00bfff" font_size="13" font_weight="bold">&gt; constraintforge generate</text><text x="665" y="70" fill="#a1a1aa" font_size="12">create_clock -name clk_sys -period 10.0</text><text x="665" y="85" fill="#ff3333" font_size="12">set_output_delay -max 3.5 [get_ports data_out]</text></svg>